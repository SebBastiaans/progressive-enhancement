<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>File upload met preview / Progressive Enhancement / FDND</title>
		<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
		<link href="assets/styles.css" rel="stylesheet">
		<style>
			form {
				display: grid;
				grid-template-rows: auto auto;
				gap: 1rem;
				width: 100%;
			}

			form > output,
			form > label {
				grid-row: 1;
				grid-column: 1;
			}

			form > button {
				grid-row: 2;
				justify-self: start;
			}

			label {
				align-self: center;
				justify-self: center;
				text-align: center;
				cursor: pointer;
				width: 100%;
				height: 100%;
				display: flex;
				justify-content: center;
				align-items: center;

				input {
					position: absolute;
					opacity: 0;
				}
			}

			label:focus-within {
				outline: 3px solid var(--blue);
				outline-offset: 3px;
			}

			output {
				--preview: none;

				display: block;
				width: 100%;
				aspect-ratio: 16 / 9;
				border-radius: .5rem;
				background-color: var(--green);
				background-image: var(--preview);
				background-size: cover;
				background-position: center;
			}
		</style>
		<script type="module">
			// stap 1: zoek de elementen
			const input = document.querySelector('input[type="file"]')
			const output = document.querySelector('output')

			// stap 2: wacht tot er een bestand gekozen wordt
			input.addEventListener('change', function() {
				const file = input.files[0]

				// stap 3: toon een preview van de gekozen afbeelding
				if (file) {
					output.style.setProperty('--preview', `url(${URL.createObjectURL(file)})`)
				}
			})
		</script>
	</head>
	<body>
		<h1>File upload met preview</h1>

		<!-- Voor het uploaden van een bestand heb je altijd een formulier nodig.
		     Dus die krijg je alvast. Maak je over de server niet druk; het gaat om de UI. -->
		<form method="post">
			<output></output>

			<label>
				Selecteer je afbeelding
				<input type="file" name="afbeelding" accept="image/*">
			</label>

			<button type="submit" class="fdnd-button">Uploaden</button>

		</form>

		<details open>
			<summary>Demo video</summary>
			<video src="assets/file.mp4" width="1496" height="496" controls muted autoplay loop>
				<a href="assets/file.mp4">assets/file.mp4</a>
			</video>
		</details>
	</body>
</html>
